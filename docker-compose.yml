# Docker Compose for ListenLedger local staging & rehearsal
# Reference: DATABASE_MIGRATION.md §6, §7

services:
  postgres:
    image: postgres:16-alpine
    container_name: listenledger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: listenledger
      POSTGRES_PASSWORD: listenledger_secret
      POSTGRES_DB: listenledger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listenledger -d listenledger"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    # Local-only: initialize a disposable database and allow HTTP cookies.
    command: ["-frontend", "/app/frontend", "-require-postgres", "-dev"]
    container_name: listenledger-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://listenledger:listenledger_secret@postgres:5432/listenledger?sslmode=disable"
      PORT: "8080"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  pgdata:


