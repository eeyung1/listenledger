# Single-instance ledger/dashboard. Edge capture is not deployed by this blueprint.
services:
  - type: web
    name: listenledger
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /readyz
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        sync: false # Restricted listenledger_app PostgreSQL URL with TLS; never commit it.
      - key: PORT
        value: "8080"
      - key: AUTO_MIGRATE
        value: "true"
