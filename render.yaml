# Render Blueprint Specification for ListenLedger
# Reference: DATABASE_MIGRATION.md §7

services:
  - type: web
    name: listenledger
    runtime: go
    plan: starter
    region: frankfurt # Low-latency routing to West Africa / Nigeria
    buildCommand: |
      cd frontend && npm ci && npm run build
      cd ../backend && go build -o ../bin/listenledger .
    startCommand: bin/listenledger -frontend frontend/dist
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false # Injected from Render Environment Secrets (Supabase connection string)
      - key: PORT
        value: "8080"
      - key: ALLOWED_ORIGINS
        sync: false # Comma-separated browser origins (empty for same-origin only)

