name: CI
on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'docs/**']
  pull_request:
permissions:
  contents: read
jobs:
  coordination:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate migration versions and dialect parity
        run: python3 scripts/agent_coordination.py migrations
      - name: Verify atomic claims and collision rejection
        run: python3 -m unittest discover -s scripts -p "test_agent_coordination.py"
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: listenledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES_URL: postgres://postgres:postgrespassword@localhost:5432/listenledger_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: backend/go.sum
      - name: Check formatting
        working-directory: backend
        run: test -z "$(gofmt -l .)"
      - name: Vet
        working-directory: backend
        run: go vet ./...
      - name: Test with race detector
        working-directory: backend
        run: go test -race ./...
      - name: Build
        working-directory: backend
        run: go build ./...
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck && npm run build && npm test
        working-directory: frontend
  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Rust formatting
        working-directory: edge
        run: cargo fmt --check
      - name: Clippy lint
        working-directory: edge
        run: cargo clippy -- -D warnings
      - name: Test edge crate
        working-directory: edge
        run: cargo test


  container:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: listenledger_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t listenledger:ci .
      - name: Verify restricted runtime, readiness, and persistence
        run: bash scripts/ci_container_smoke.sh '${{ job.services.postgres.id }}'
